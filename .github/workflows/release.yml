# Runs when scripts/release.sh pushes a vX.Y.Z tag:
#   1. build   – checks the tag matches manifest.json, builds the ZIP, creates the GitHub release
#   2. publish – uploads the ZIP to the Chrome Web Store and submits it for review
#
# The publish job runs only after someone approves the 'chrome-web-store'
# environment, and is skipped until the CWS_* repository variables are set.
# It signs in to Google with GitHub OIDC (no stored secret); see
# scripts/setup-google.sh and the Release section of README.md.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches manifest.json
        run: |
          version="$(jq -r .version manifest.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version. Release with scripts/release.sh."
            exit 1
          fi

      - name: Package
        id: package
        env:
          HC_OAUTH_CLIENT_TR: ${{ vars.HC_OAUTH_CLIENT_TR }}
          HC_OAUTH_CLIENT_GLOBAL: ${{ vars.HC_OAUTH_CLIENT_GLOBAL }}
        run: echo "zip=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  publish:
    name: Publish to Chrome Web Store
    needs: build
    if: vars.CWS_ITEM_ID != ''
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write # GitHub OIDC → Google access token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
          path: dist

      - name: Sign in to Google
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: scripts/publish-cws.sh "$ZIP"
