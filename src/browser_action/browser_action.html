<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hipcall</title>
  <link rel="stylesheet" href="browser_action.css">
</head>
<body>
  <header>
    <img class="logo" src="../../icons/hipcall-logo.svg" alt="Hipcall">
    <button class="open" id="openWebphone">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      <span data-i18n="openWebphone"></span>
    </button>
    <button class="icon-btn gear" id="openSettings" data-i18n-title="tabSettings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.1 7.1 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.67 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.1 7.1 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.05.24.25.42.49.42h3.84c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg></button>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="find" role="tab" data-i18n="tabNumbers"></button>
    <button class="tab" data-tab="activities" role="tab" data-i18n="tabActivities"></button>
  </nav>

  <main>
    <!-- ============ NUMBERS ============ -->
    <section class="panel" id="panel-find">
      <div id="scanArea">
        <div class="toolbar">
          <div class="site" id="findSite"></div>
          <button class="ghost" id="rescan">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            <span data-i18n="rescan"></span>
          </button>
        </div>
        <label class="opt" id="deepOpt"><input type="checkbox" id="deep"> <span data-i18n="scanContactPages"></span></label>
        <div id="status" role="status"></div>

        <!-- LinkedIn profile / company page: its own Discover view -->
        <div id="linkedinArea" hidden></div>

        <div class="results" id="genericResults">
          <h2><span data-i18n="phones"></span><span class="count" id="phoneCount"></span></h2>
          <ul id="phones"></ul>
          <h2><span data-i18n="emails"></span><span class="count" id="emailCount"></span></h2>
          <ul id="emails"></ul>

          <!-- FIND: look the page up in the Hipcall CRM -->
          <div class="find card">
            <div class="find-head">
              <div>
                <b data-i18n="findTitle"></b>
                <small data-i18n="findHint"></small>
              </div>
              <button class="primary small" id="findBtn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
                <span data-i18n="findButton"></span>
              </button>
            </div>
            <div id="findStatus" class="muted"></div>
            <div id="findResults"></div>
          </div>
        </div>
      </div>

      <div class="empty-state" id="cannotScan" hidden>
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.93 6h-2.95a15.6 15.6 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.93 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14a8.2 8.2 0 0 1 0-4h3.38a16.5 16.5 0 0 0 0 4H4.26zm.81 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.99 7.99 0 0 1 5.07 16zm2.95-8H5.07a7.99 7.99 0 0 1 4.33-3.56A15.6 15.6 0 0 0 8.02 8zM12 19.96A14.1 14.1 0 0 1 10.09 16h3.82A14.1 14.1 0 0 1 12 19.96zM14.34 14H9.66a14.7 14.7 0 0 1 0-4h4.68a14.7 14.7 0 0 1 0 4zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14a16.5 16.5 0 0 0 0-4h3.38a8.2 8.2 0 0 1 0 4h-3.38z"/></svg>
        </div>
        <h3 data-i18n="emptyTitle"></h3>
        <p data-i18n="emptyText"></p>
      </div>

      <form class="dial" id="manual">
        <input type="text" id="manualNumber" data-i18n-placeholder="manualPlaceholder" inputmode="tel" autocomplete="off">
        <button class="primary" type="submit" data-i18n="call"></button>
      </form>
    </section>

    <!-- ============ ACTIVITIES ============ -->
    <section class="panel" id="panel-activities" hidden>
      <div class="signin-prompt" id="activitiesSignin" hidden></div>
      <div id="activitiesArea" hidden>
        <div class="toolbar">
          <div class="site" data-i18n="activitiesHint"></div>
          <button class="ghost" id="activitiesRefresh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            <span data-i18n="refresh"></span>
          </button>
        </div>
        <div id="activitiesStatus" class="muted"></div>
        <ul class="feed" id="activitiesList"></ul>
        <button class="soft wide" id="activitiesMore" hidden data-i18n="loadMore"></button>
      </div>
    </section>
  </main>

  <!-- ============ SETTINGS (opens from the gear) ============ -->
  <section class="sheet" id="panel-settings" hidden aria-labelledby="settingsTitle">
    <div class="sheet-head">
      <button class="icon-btn" id="closeSettings" data-i18n-title="back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <h1 id="settingsTitle" data-i18n="tabSettings"></h1>
    </div>
    <div class="sheet-body">
      <div class="group">
        <h2 data-i18n="accountTitle"></h2>
        <div class="card account" id="accountCard"></div>
      </div>

      <div class="group">
        <h2 data-i18n="regionTitle"></h2>
        <p class="sub" data-i18n="regionSub"></p>
        <div class="card list" id="regionList" role="radiogroup"></div>
      </div>

      <div class="group">
        <h2 id="languageTitle" data-i18n="languageTitle"></h2>
        <div class="select-wrap">
          <!-- New languages: add an <option> and a _locales/<code> folder. -->
          <select id="language" aria-labelledby="languageTitle">
            <option value="auto" data-i18n="langAuto"></option>
            <option value="de" lang="de">Deutsch</option>
            <option value="en" lang="en">English</option>
            <option value="es" lang="es">Español</option>
            <option value="fr" lang="fr">Français</option>
            <option value="it" lang="it">Italiano</option>
            <option value="nl" lang="nl">Nederlands</option>
            <option value="tr" lang="tr">Türkçe</option>
          </select>
        </div>
      </div>

      <div class="group">
        <h2 data-i18n="callTitle"></h2>
        <label class="card switch-row">
          <span><b data-i18n="autoDial"></b><small data-i18n="autoDialHint"></small></span>
          <input type="checkbox" class="switch" id="autoDial">
        </label>
      </div>

      <div class="group" id="siteSettings">
        <h2 data-i18n="iconsOnSite"></h2>
        <div class="site-name">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 0 1-7.75-6h3.39a16 16 0 0 0 .46 3.13h1.98A14.5 14.5 0 0 1 9.6 14h4.8a14.5 14.5 0 0 1-.48 3.13h1.98c.24-1 .4-2.05.46-3.13h3.39A8 8 0 0 1 12 20zM4.25 10a8 8 0 0 1 15.5 0h-3.39a16 16 0 0 0-.46-3.13H13.92c.23.98.4 2.03.48 3.13H9.6c.08-1.1.25-2.15.48-3.13H8.1c-.24 1-.4 2.05-.46 3.13H4.25z"/></svg>
          <b id="setSite"></b>
        </div>

        <div class="segmented" id="modeSeg" role="radiogroup">
          <button data-value="selected" role="radio" data-i18n="modeSelected"></button>
          <button data-value="all" role="radio" data-i18n="modeAll"></button>
        </div>
        <p class="sub" id="modeHint"></p>

        <label class="card switch-row">
          <span><b data-i18n="showOnThisPage"></b><small id="curPath"></small></span>
          <input type="checkbox" class="switch" id="curToggle">
        </label>

        <h3 class="list-title" id="listTitle"></h3>
        <div class="chips" id="pageList"></div>
        <div class="muted" id="pageEmpty"></div>

        <form class="add" id="addPageForm">
          <input type="text" id="addPageInput" autocomplete="off">
          <button class="soft" type="submit" data-i18n="add"></button>
        </form>
        <div class="muted small" data-i18n="patternHint"></div>

        <button class="link" id="resetRule" data-i18n="resetSite"></button>
      </div>
    </div>
  </section>

  <!-- ============ ADD COMPANY (prefilled from the page, editable) ============ -->
  <section class="sheet" id="panel-company" hidden aria-labelledby="companyTitle">
    <div class="sheet-head">
      <button class="icon-btn" id="closeCompany" data-i18n-title="back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <h1 id="companyTitle" data-i18n="companyAddTitle"></h1>
    </div>
    <form class="sheet-body company-form" id="companyForm" novalidate>
      <p class="sub" data-i18n="companyAddHint"></p>

      <label class="field">
        <span data-i18n="fieldName"></span>
        <input type="text" id="cName" maxlength="255" required>
        <em class="field-err" data-for="name"></em>
      </label>
      <label class="field">
        <span data-i18n="fieldWebsite"></span>
        <input type="text" id="cWebsite" maxlength="255" inputmode="url" placeholder="https://">
        <em class="field-err" data-for="website_url"></em>
      </label>
      <label class="field">
        <span data-i18n="fieldLinkedin"></span>
        <input type="text" id="cLinkedin" maxlength="255" inputmode="url" placeholder="https://linkedin.com/company/…">
        <em class="field-err" data-for="linkedin_url"></em>
      </label>
      <label class="field">
        <span data-i18n="fieldCustomUrl"></span>
        <input type="text" id="cCustomUrl" maxlength="255" inputmode="url" placeholder="https://">
        <em class="field-err" data-for="custom_url"></em>
      </label>
      <label class="field">
        <span data-i18n="fieldEmployees"></span>
        <div class="select-wrap"><select id="cEmployees"></select></div>
        <em class="field-err" data-for="employee_size"></em>
      </label>
      <label class="field">
        <span data-i18n="fieldDescription"></span>
        <textarea id="cDescription" rows="3" maxlength="2000"></textarea>
        <em class="field-err" data-for="description"></em>
      </label>

      <div class="field">
        <span><span data-i18n="fieldPhones"></span> <small class="limit" id="cPhonesCount"></small></span>
        <ul class="multi" id="cPhones"></ul>
        <button type="button" class="link-btn" id="cAddPhone" data-i18n="addPhone"></button>
        <em class="field-err" data-for="phones"></em>
      </div>
      <div class="field">
        <span><span data-i18n="fieldEmails"></span> <small class="limit" id="cEmailsCount"></small></span>
        <ul class="multi" id="cEmails"></ul>
        <button type="button" class="link-btn" id="cAddEmail" data-i18n="addEmail"></button>
        <em class="field-err" data-for="emails"></em>
      </div>

      <!-- Account-defined fields (GET /api/v3/companies/custom-fields) -->
      <div id="cCustom"></div>

      <div class="field">
        <span data-i18n="fieldOwner"></span>
        <div class="owner" id="cOwner"></div>
      </div>

      <div id="companyStatus" class="form-status" role="status"></div>
      <div class="form-actions">
        <button type="button" class="soft" id="cancelCompany" data-i18n="cancel"></button>
        <button type="submit" class="primary" id="saveCompany" data-i18n="saveCompany"></button>
      </div>
    </form>
  </section>

  <script src="../../js/config.js"></script>
  <script src="../../js/i18n.js"></script>
  <script src="../../js/site_rules.js"></script>
  <script src="browser_action.js"></script>
</body>
</html>
